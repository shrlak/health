<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render harness</title>
    <script>
      // Mirrors index.html, so the harness shows the same first frame.
      (function () {
        try {
          var stored = localStorage.getItem('health-dashboard-theme')
          var dark = stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/scripts/preview/main.tsx"></script></body>
</html>
