name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs are left to finish so a half-uploaded
# artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vite inlines these at build time. Both are public by design: the
      # publishable key identifies the project, and Row Level Security is what
      # protects the data. Set repository variables of the same name to point a
      # fork at a different Supabase project.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://datihyxdmpshreyifvzn.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ELxGSab8ISe1RaejUkKNtw_urwJd2ed' }}
      # A project site is served from /<repo>/, so assets need that prefix.
      # Derived from the repo name so a rename does not break the build.
      VITE_BASE: /${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than shipping a broken page.
      - name: Typecheck
        run: npm run typecheck

      - name: Test parsers
        run: npm test

      - name: Build
        run: npm run build

      # Stops Pages from running the content through Jekyll, which would drop
      # any path beginning with an underscore.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
